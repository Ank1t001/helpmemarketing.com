<!doctype html><html><head><meta charset="utf-8"><title>Real Estate Index card artwork</title>
<link rel="stylesheet" href="/styles.css">
<style>
/* Artwork source for /assets/index/real-estate/card.webp (1056x591) and its -704 variant, the /hmm-index card, rendered by Playwright in the Med Spa and Business Finance card pattern (founder, 2026-11-02). Text and outline shapes only: no account screenshots, logos or brand colours. The page hero image is separate and unchanged. Not a site page (the kit is not deployed). */
html,body{margin:0;background:#0B0B0B}
.art{position:relative;width:1056px;height:591px;overflow:hidden;background:radial-gradient(circle at 100% 0,rgba(255,90,31,.30),rgba(11,11,11,0) 44%),#0B0B0B;color:#F7F6F2;font-family:Inter,sans-serif}
.k{position:absolute;left:64px;top:62px;display:flex;align-items:center;gap:13px;font-size:17px;letter-spacing:.14em;color:#CFCBC2}
.k img{height:16px;width:auto}
h1{position:absolute;left:64px;top:196px;margin:0;font-family:Fraunces,serif;font-weight:400;font-size:84px;line-height:1;letter-spacing:-.03em;color:#F7F6F2;white-space:nowrap}
.tag{position:absolute;right:64px;top:292px;font-size:17px;font-weight:700;letter-spacing:.14em;color:#FF5A1F}
.sub{position:absolute;left:64px;top:452px;width:640px;font-size:19px;line-height:1.45;color:#CFCBC2}
.bars{position:absolute;right:64px;top:150px;display:flex;align-items:flex-end;gap:14px;height:110px}.bars span{width:30px;border:2px solid #F7F6F2;border-radius:4px 4px 0 0;border-bottom:0;opacity:.85;box-sizing:border-box}.bars::after{content:"";position:absolute;left:-8px;right:-8px;bottom:0;height:2px;background:#F7F6F2;opacity:.6}
</style></head><body>
<div class="art"><div class="k"><img src="/assets/brand/hmm-mark.svg" alt="">THE HMM INDEX &middot; INSTAGRAM</div>
<h1>Real Estate Index</h1>
<div class="bars"><span style="height:100%"></span><span style="height:80%"></span><span style="height:62%"></span><span style="height:46%"></span><span style="height:32%"></span></div>
<div class="tag">5 FIRMS COMPARED</div>
<div class="sub">Five Canadian private real estate investment firms compared on Instagram, Meta ads and websites.</div></div>
</body></html>
