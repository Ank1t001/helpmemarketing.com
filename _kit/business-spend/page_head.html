.msi.msi header .bs-meta{margin:0 0 6px;font-size:13.5px;line-height:1.55;color:var(--text-muted)}

.msi.msi .bs-view+.bs-view{border-top:1px solid var(--border-strong);padding-top:40px}

<script data-bsi-tabs>
/* Views as tabs (2026-10-23). Without JavaScript every view shows in reading order and the links jump to it. With it, one view shows at a time: the links become an ARIA tablist (arrow keys, Home, End), the address keeps the view (#bs-compare), Back and Forward restore it, and any link to an id inside a view (a section, an evidence item, a closed expander) opens that view and the expanders around the target. Print shows every view. */
(function () {
  var d = document, tabs = [], panels = [], nav = null;
  function viewOf(el) { for (var p = el; p && p.nodeType === 1; p = p.parentNode) { if (p.classList.contains('bs-view')) return p; } return null; }
  function openAround(el) { for (var p = el; p && p.nodeType === 1; p = p.parentNode) { if (p.tagName === 'DETAILS') p.open = true; } }
  function target(hash) {
    var id = (hash || '').replace(/^#/, '');
    try { id = decodeURIComponent(id); } catch (e) {}
    return id ? d.getElementById(id) : null;
  }
  var kbd = false;
  d.addEventListener('keydown', function (e) { if (!e.altKey && !e.ctrlKey && !e.metaKey) kbd = true; }, true);
  d.addEventListener('pointerdown', function () { kbd = false; }, true);
  function focusable(el) {
    if (!el.hasAttribute('tabindex') && !/^(A|BUTTON|INPUT|SELECT|TEXTAREA|SUMMARY)$/.test(el.tagName)) el.setAttribute('tabindex', '-1');
    if (el.getAttribute('tabindex') === '-1') el.classList.toggle('bs-pfocus', !kbd);
    try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
  }
  function show(panel) {
    panels.forEach(function (p, i) {
      var on = p === panel;
      p.hidden = !on;
      tabs[i].setAttribute('aria-selected', on ? 'true' : 'false');
      tabs[i].tabIndex = on ? 0 : -1;
    });
  }
  function above(el) { return el.getBoundingClientRect().top < nav.getBoundingClientRect().bottom; }
  /* Instant, not the site's smooth scrolling: the view changes under the scroll, and two smooth scrolls would cut each other short. */
  function jump(el) { try { el.scrollIntoView({ block: 'start', behavior: 'instant' }); } catch (e) { el.scrollIntoView(); } }
  function go(hash, how) {
    var el = target(hash), panel = el && viewOf(el);
    if (!tabs.length) { if (el) openAround(el); return; }
    if (el && !panel) return;            /* outside the views, such as the review box: the browser handles it */
    if (!panel) { panel = panels[0]; el = null; }
    show(panel);
    if (el && el !== panel) openAround(el);
    if (how === 'tab' || how === 'key' || !el) { if (above(panel)) jump(panel); }
    else jump(el);
    var a = d.activeElement, av = a && a !== d.body && viewOf(a);
    if (how === 'link') focusable(el || panel);
    else if (av && av.hidden) focusable(el || tabs[panels.indexOf(panel)]);
  }
  function activate(i, how) {
    var h = '#' + panels[i].id;
    if (location.hash !== h) { if (how === 'key') history.replaceState(null, '', h); else history.pushState(null, '', h); }
    go(h, how);
  }
  d.addEventListener('DOMContentLoaded', function () {
    nav = d.querySelector('.bs-views');
    var list = nav && nav.querySelector('.bs-tablist');
    if (list && window.history && history.pushState) {
      tabs = Array.prototype.slice.call(list.querySelectorAll('a[href^="#"]'));
      panels = tabs.map(function (a) { return d.getElementById(a.getAttribute('href').slice(1)); });
      if (!tabs.length || panels.some(function (p) { return !p; })) { tabs = []; panels = []; }
    }
    if (tabs.length) {
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      list.setAttribute('role', 'tablist');
      list.setAttribute('aria-label', 'Views of this research');
      tabs.forEach(function (a, i) {
        var p = panels[i];
        a.setAttribute('role', 'tab');
        a.setAttribute('aria-controls', p.id);
        p.setAttribute('role', 'tabpanel');
        p.setAttribute('aria-labelledby', a.id);
        p.tabIndex = 0;
        a.addEventListener('click', function (e) {
          if (e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
          e.preventDefault(); activate(i, 'tab'); a.focus();
        });
      });
      list.addEventListener('keydown', function (e) {
        var i = tabs.indexOf(e.target), n = -1;
        if (i < 0) return;
        if (e.key === 'ArrowRight') n = (i + 1) % tabs.length;
        else if (e.key === 'ArrowLeft') n = (i - 1 + tabs.length) % tabs.length;
        else if (e.key === 'Home') n = 0;
        else if (e.key === 'End') n = tabs.length - 1;
        else if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); activate(i, 'tab'); return; }
        if (n < 0) return;
        e.preventDefault(); tabs[n].focus(); activate(n, 'key');
      });
      nav.classList.add('is-tabs');
      d.addEventListener('click', function (e) {
        if (e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        var a = e.target.closest && e.target.closest('a[href^="#"]');
        if (!a || tabs.indexOf(a) >= 0) return;
        var h = a.getAttribute('href'), el = target(h), panel = el && viewOf(el);
        if (!panel) return;
        e.preventDefault();
        show(panel);
        if (el !== panel) openAround(el);
        if (location.hash !== h) location.hash = h;
        go(h, 'link');
      });
    }
    go(location.hash, 'load');
    window.addEventListener('popstate', function () { go(location.hash, 'pop'); });
    window.addEventListener('hashchange', function () { go(location.hash, 'pop'); });
  });
})();

  function push(o){ try { window.dataLayer = window.dataLayer || []; window.dataLayer.push(o); } catch (e) {} }
