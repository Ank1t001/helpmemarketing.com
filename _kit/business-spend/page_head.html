    if (c.length !== 6) return show('code', codeEl);
    show(''); setBusy(verifyBtn, true, form.getAttribute('data-checking'));
    post({ form: 'research-verify', research: R, email: email, code: c }).then(function (j) {
      setBusy(verifyBtn, false, verifyText);
      if (j && j.result === 'ok' && j.verified === true) {
        try { var o = JSON.parse(localStorage.getItem(KEY) || '{}'); o[R] = Date.now(); localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {}
        track({ event: 'research_unlock', research: R });
        var card = opener && opener.closest('[data-gate-card]'), part = card && card.previousElementSibling;
        lock(false); close();
        if (part) { part.setAttribute('tabindex', '-1'); try { part.focus({ preventScroll: true }); } catch (e) { part.focus(); } part.scrollIntoView({ block: 'nearest' }); }
        return;
      }
      if (j && j.result === 'ok' && j.verified === false) { var r = j.reason; return show(r === 'wrong' ? 'wrong' : r === 'too_many' ? 'too-many' : 'expired', codeEl); }
      throw new Error('reply');
    }).catch(function () { setBusy(verifyBtn, false, verifyText); show('check'); });
  }
  form.addEventListener('submit', function (e) { e.preventDefault(); if (steps.email.hidden) verify(); else request(); });
  verifyBtn.addEventListener('click', verify);
  codeEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); verify(); } });
  form.querySelector('[data-gate-resend]').addEventListener('click', function () { step('email'); request(); });
  form.querySelector('[data-gate-change]').addEventListener('click', function () { show(''); step('email'); emailEl.select(); });
});
</script>
